services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ysda
      POSTGRES_PASSWORD: ysda-test
      POSTGRES_DB: ysda_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ysda -d ysda_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ../sql/postgres_seed.sql:/docker-entrypoint-initdb.d/001-seed.sql:ro
