[workspace]
members = [
    "apps/ysda",
    "crates/ys-agent-core",
    "crates/ys-agent-runtime",
    "crates/ys-agent-store",
    "crates/ys-agent-adapters",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
hex = "0.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-textarea = { version = "0.9", default-features = false, features = ["crossterm"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
liter-llm = { version = "=1.19.1", default-features = false, features = ["native-http"] }
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
ring = "=0.17.14"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
secrecy = "=0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
sqlparser = "0.62"
sqlx = { version = "0.9", default-features = false, features = [
    "bigdecimal",
    "chrono",
    "json",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
] }
thiserror = "2"
tempfile = "3"
toml = "1.0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
webbrowser = "=1.2.4"
wiremock = "0.6"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
